<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">Synthetic handwritten algebra work</title><desc id="desc">A notebook page showing the equation three times x minus two equals twelve, followed by an incorrect distribution step.</desc><defs><pattern id="lines" width="900" height="54" patternUnits="userSpaceOnUse"><rect width="900" height="54" fill="#fffef8"/><path d="M0 53.5H900" stroke="#d9e7f8" stroke-width="1"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".12"/></filter></defs><g filter="url(#shadow)"><rect x="35" y="28" width="830" height="550" rx="14" fill="url(#lines)"/><path d="M110 28V578" stroke="#f5a8a8" stroke-width="2"/></g><g fill="#24324a" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="43"><text x="150" y="120">Solve: 3(x − 2) = 12</text><text x="170" y="214">3x − 2 = 12</text><text x="170" y="314">3x = 14</text><text x="170" y="414">x = 14/3</text></g><path d="M145 170c124 18 238 15 338 1" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" opacity=".75"/><g transform="rotate(-5 680 470)"><rect x="600" y="443" width="196" height="58" rx="10" fill="#fff4df" stroke="#e2a33c" stroke-width="2"/><text x="621" y="480" fill="#8a5612" font-family="Arial, sans-serif" font-size="20" font-weight="700">SYNTHETIC SAMPLE</text></g></svg>
